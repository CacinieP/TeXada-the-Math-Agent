[package]
name = "texada-shell"
version = "0.3.7"
description = "TeXada floating shell — math formula agent"
authors = ["TeXada"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/CacinieP/TeXada-the-Math-Agent"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSColor",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "CALayer",
    "objc2-core-foundation",
] }

[profile.release]
strip = true
opt-level = "s"
lto = true
