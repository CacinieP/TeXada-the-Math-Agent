- id: rw-046
  category: completion
  input: \begin{pmatrix}1&2\\
  anchor: \begin{pmatrix}1&2\\3&4\end{pmatrix}
  reference: \begin{pmatrix}1&2\\3&4\end{pmatrix}
  source: 公式手册.md §九
