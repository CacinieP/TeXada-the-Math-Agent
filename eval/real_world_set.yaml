  category: completion
  input: \lim_{x \to 0}
  anchor: \lim
  reference: \lim_{x\to 0}f(x)
  source: 02-高数/01-极限与连续.md
- id: rw-049
  category: completion
  input: \int_0^1
  anchor: \int_0^1
  reference: \int_0^1 f(x)\,dx
  source: 公式手册.md §四
- id: rw-050
  category: completion
  input: \left(\frac{a}{b}
  anchor: \frac{a}{b}
  reference: \left(\frac{a}{b}\right)
  source: LaTeX 括号不配对
