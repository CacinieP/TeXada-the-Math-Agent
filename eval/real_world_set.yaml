- id: rw-051
  category: completion
  input: \frac{\partial^2 f}{\partial x}
  anchor: \partial
  reference: \frac{\partial^2 f}{\partial x^2}
  source: 02-高数/04-多元微分.md
- id: rw-052
  category: completion
  input: \alpha + \bet
  anchor: \beta
  reference: \alpha+\beta
  source: 拼写补全（\bet → \beta）
  note: 输出必须能被 KaTeX 解析（\bet 不是命令）
