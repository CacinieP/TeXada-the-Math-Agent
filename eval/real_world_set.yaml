- id: rw-045
  category: completion
  input: \begin{case}fx
  anchor: \begin{cases}fx\end{cases}
  reference: \begin{cases}fx\end{cases}
  forbid:
  - \begin{case}
  source: ~/.texada/runs.db 2026-07-31 真实调用（当时 error）
