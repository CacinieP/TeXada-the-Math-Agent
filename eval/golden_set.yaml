  category: C
  input: 从 n 个元素中选 k 个的组合数
  anchor: \frac{n!}{k!(n-k)!} 或 \binom{n}{k}
- id: 039
  category: D
  input: x 趋近于零时 sin x 除以 x 的极限
  anchor: \lim_{x\to 0}\frac{\sin x}{x}
