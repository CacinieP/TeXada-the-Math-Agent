annotation_author: Codex mathematical review, not independent human verification
frozen_before_new_run: true
pilot_revision_note: v1 pilot revealed notation-versus-definition and unspecified-Jacobian-dimension ambiguity;
  three inputs clarified in v2 before all final runs; all pilot evidence preserved
primary_input_policy: clarified_complete_100; original source preserved and original run also reported
equivalence_policy:
- Accept equivalent mathematical quantities and relations under each case domain, not just literal/structural
  matches.
- Accept algebraic rearrangement and proper complete computed values for value/expression tasks.
- Preserve prescribed free variables, domains, relation direction, bound limits, dimensional measure and
  requested representation constraints.
- Do not equate quantified/relational tasks to bare tautologies or replace requested factorization with
  the original unfactored expression.
- Notation and vector/font aliases are role-specific; do not blindly strip all fonts or rename all variables.
- Finite geometric closed forms must retain the r=1 case; branches, constants of integration, excluded
  denominator points and derivative order matter.
- Original ambiguous inputs can match independently authored reasonable interpretations; report their
  score separately from clear original cases.
- Automated supported equality checks provide evidence; all nontrivial outputs receive an explicit per-case
  agent mathematical verdict. No MiniCPM self-judge.
