name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Pre-release audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Ruff
        run: uv run --extra dev ruff check .

      - name: Pytest
        run: uv run --extra dev pytest

      - name: Python dependency audit
        run: uvx pip-audit --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --audit-level=moderate

      - name: JavaScript syntax check
        run: node --check tauri-shell/src/main.js

  build:
    name: Build ${{ matrix.name }}
    needs: audit
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 dmg
            os: macos-26
            rust-targets: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel dmg
            os: macos-15-intel
            rust-targets: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows x64 NSIS
            os: windows-2025
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell/src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Require macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" || { echo "::error::Missing APPLE_CERTIFICATE secret (base64 .p12)."; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Missing APPLE_CERTIFICATE_PASSWORD secret."; exit 1; }

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || 'Yichun Deng' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tauri-shell/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.tauri-args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: TeXada Desktop v__VERSION__
          releaseBody: |
            TeXada Desktop 0.1.0

            English:
            - Local-first math formula agent powered by MiniCPM and Ollama.
            - Supports natural language to LaTeX, formula OCR, completion, snippets, history and desktop insertion.
            - Supports OpenAI API-compatible cloud text and vision models.
            - Includes signed macOS DMGs and Windows x64 NSIS installer.

            中文：
            - 端侧优先的数学公式 Agent，默认使用 MiniCPM 和 Ollama。
            - 支持自然语言转 LaTeX、公式 OCR、补全、缩写、历史记录和桌面光标处键入。
            - 支持 OpenAI API 兼容的云侧文本和视觉模型。
            - 提供已签名 macOS DMG 和 Windows x64 NSIS 安装包。

            Author: CacinieP
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.name }}
          releaseAssetNamePattern: TeXada-[version]-[platform]-[arch]-[bundle][setup][ext]

      - name: Verify macOS package signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_SIGNER: ${{ secrets.APPLE_SIGNING_IDENTITY || 'Yichun Deng' }}
        run: |
          set -euo pipefail
          dmg="$(find tauri-shell/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg" || { echo "::error::DMG artifact not found."; exit 1; }
          codesign --verify --verbose=2 "$dmg"
          codesign -dv --verbose=4 "$dmg" 2> /tmp/texada-dmg-codesign.txt
          grep -F "$EXPECTED_SIGNER" /tmp/texada-dmg-codesign.txt

          mount_dir="$(mktemp -d)"
          if hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -quiet; then
            trap 'hdiutil detach "$mount_dir" -quiet || true; rm -rf "$mount_dir"' EXIT
            app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            if [ -n "$app" ]; then
              codesign --verify --deep --strict --verbose=2 "$app"
              codesign -dv --verbose=4 "$app" 2> /tmp/texada-app-codesign.txt
              grep -F "$EXPECTED_SIGNER" /tmp/texada-app-codesign.txt
            else
              echo "::warning::Signed DMG verified, but no .app was found after mounting."
            fi
          else
            rm -rf "$mount_dir"
            echo "::warning::Signed DMG verified, but CI could not mount it for inner app verification."
          fi
