name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind release version and source commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: release
        run: python scripts/prepare-desktop-release.py preflight --expected-commit "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  audit:
    name: Pre-release audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Ruff
        run: uv run --locked --extra dev --extra cas-eval ruff check .

      - name: Pytest
        run: uv run --locked --extra dev --extra cas-eval pytest

      - name: Python dependency audit
        # Audit the real project dependency tree. `uvx pip-audit`
        # alone runs inside an ephemeral environment and only audits
        # pip-audit's own dependencies; export the project's resolved
        # requirements instead, omitting the local project itself because
        # pip-audit resolves distribution packages from PyPI.
        run: |
          uv export --locked --extra dev --extra cas-eval --format requirements-txt --no-hashes --no-emit-project > /tmp/texada-requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/texada-requirements.txt --strict

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --audit-level=low

      - name: JavaScript syntax check
        run: node --check tauri-shell/src/main.js

      - name: Frontend regressions
        run: node --test tests/*.test.cjs

  glib-backport:
    name: GTK3 glib iterator backport (release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install GLib development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libglib2.0-dev
      # The advisory reproduces with optimized iterators. This isolated crate
      # test exercises the backported source even on non-GTK desktop hosts.
      - name: Optimized iterator regression
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/texada-glib-target
        run: cargo test --release --manifest-path tauri-shell/src-tauri/vendor/glib-0.18.5/Cargo.toml --lib variant_iter

  build:
    name: Build ${{ matrix.name }}
    needs: [audit, glib-backport, preflight]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 dmg
            os: macos-26
            rust-targets: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel dmg
            os: macos-15-intel
            rust-targets: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64 NSIS
            os: windows-2025
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: Linux x64 deb and AppImage
            os: ubuntu-24.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: --target x86_64-unknown-linux-gnu --bundles deb,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux native build and installation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xvfb xauth

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell/src-tauri -> target

      - name: Restore pinned Tauri CLI
        id: cli-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.12.2-${{ matrix.rust-targets }}-${{ matrix.os }}

      - name: Install Tauri CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "2.12.2" --locked

      - name: Save pinned Tauri CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.12.2-${{ matrix.rust-targets }}-${{ matrix.os }}

      - name: Require macOS signing and notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" || { echo "::error::Missing signing secret APPLE_CERTIFICATE (base64 .p12)."; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Missing signing secret APPLE_CERTIFICATE_PASSWORD."; exit 1; }
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "::error::Missing signing secret APPLE_SIGNING_IDENTITY."; exit 1; }
          case "$APPLE_SIGNING_IDENTITY" in
            Developer\ ID\ Application:*) ;;
            *)
              echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity for notarized macOS distribution."
              echo "::error::Apple Development identities can run local builds but Apple notarization rejects them."
              exit 1
              ;;
          esac
          test -n "$APPLE_NOTARY_KEY_ID" || { echo "::error::Missing notarization secret APPLE_NOTARY_KEY_ID."; exit 1; }
          test -n "$APPLE_NOTARY_ISSUER_ID" || { echo "::error::Missing notarization secret APPLE_NOTARY_ISSUER_ID."; exit 1; }
          test -n "$APPLE_NOTARY_KEY" || { echo "::error::Missing notarization secret APPLE_NOTARY_KEY (raw .p8 text or base64 .p8)."; exit 1; }

      - name: Import macOS signing certificate for sidecar
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/texada-signing.p12"
          keychain_path="$RUNNER_TEMP/texada-signing.keychain-db"
          CERT_PATH="$cert_path" python -c 'import base64, os; from pathlib import Path; Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" > "$RUNNER_TEMP/codesign-identities.txt"
          grep -F "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/codesign-identities.txt"
          grep -F "Developer ID Application:" "$RUNNER_TEMP/codesign-identities.txt" || {
            echo "::error::APPLE_CERTIFICATE must contain a Developer ID Application private key."
            exit 1
          }

      - name: Fetch pinned llama-server binary
        run: bash scripts/fetch-llama-server.sh "${{ matrix.rust-targets }}"

      - name: Sign bundled macOS llama runtime
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          runtime_dir="tauri-shell/src-tauri/resources/llama-server"
          while IFS= read -r -d '' item; do
            case "$(file -b "$item")" in
              *Mach-O*) codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$item" ;;
            esac
          done < <(find "$runtime_dir" -type f -print0)

      - name: Build bundled FastAPI backend sidecar
        env:
          PYINSTALLER_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python scripts/build-backend-sidecar.py --mode pyinstaller --target ${{ matrix.rust-targets }}

      - name: Verify macOS sidecar JIT entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sidecar="tauri-shell/src-tauri/resources/texada-backend/texada-backend"
          test -x "$sidecar" || { echo "::error::Bundled macOS sidecar not found."; exit 1; }
          entitlements="$(codesign -d --entitlements - "$sidecar" 2>/dev/null)"
          grep -F "com.apple.security.cs.allow-jit" <<< "$entitlements"
          grep -F "com.apple.security.cs.allow-unsigned-executable-memory" <<< "$entitlements"
          grep -F "com.apple.security.cs.disable-library-validation" <<< "$entitlements"

      - name: Smoke test signed macOS KaTeX sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sidecar="tauri-shell/src-tauri/resources/texada-backend/texada-backend"
          response="$RUNNER_TEMP/texada-agent-response.json"
          log="$RUNNER_TEMP/texada-sidecar.log"
          "$sidecar" > "$log" 2>&1 &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true; wait "$sidecar_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18732/api/status >/dev/null; then
              break
            fi
            if ! kill -0 "$sidecar_pid" 2>/dev/null; then
              cat "$log"
              echo "::error::Signed macOS sidecar exited during startup."
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"text":"二重积分","render_mode":"katex"}' \
            http://127.0.0.1:18732/api/agent > "$response"
          RESPONSE_PATH="$response" python -c '
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESPONSE_PATH"]).read_text())
          assert result["valid"] is True, result
          assert result["tokens_used"] == 0, result
          assert result["stop_reason"] == "deterministic_candidate", result
          assert result["committed"] is True, result
          assert result["review"] is None, result
          assert result["semantic_document"]["parser_backend"] == "katex-0.18.2-v8", result
          '

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: tauri-shell/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.tauri-args }}

      - name: Normalize installer filenames for stable download links
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TARGET: ${{ matrix.rust-targets }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version, target = os.environ["RELEASE_VERSION"], os.environ["RELEASE_TARGET"]
          layouts = {
              "aarch64-apple-darwin": [("dmg", "*.dmg", f"TeXada_{version}_aarch64.dmg")],
              "x86_64-apple-darwin": [("dmg", "*.dmg", f"TeXada_{version}_x64.dmg")],
              "x86_64-pc-windows-msvc": [("nsis", "*.exe", f"TeXada_{version}_x64-setup.exe")],
              "x86_64-unknown-linux-gnu": [("deb", "*.deb", f"TeXada_{version}_amd64.deb"),
                                           ("appimage", "*.AppImage", f"TeXada_{version}_amd64.AppImage")],
          }
          for bundle, pattern, name in layouts[target]:
              candidates = list(Path("tauri-shell/src-tauri/target").glob(f"**/bundle/{bundle}/{pattern}"))
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one {bundle} installer, found {len(candidates)}")
              original = candidates[0]
              original.replace(original.with_name(name))
          PY

      - name: Verify macOS package signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_SIGNER: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          dmg="$(find tauri-shell/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg" || { echo "::error::DMG artifact not found."; exit 1; }
          app="$(find tauri-shell/src-tauri/target -path '*/bundle/macos/*.app' -print -quit)"
          if [ -n "$app" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2> /tmp/texada-app-codesign.txt
            grep -F "$EXPECTED_SIGNER" /tmp/texada-app-codesign.txt
            grep -F "Developer ID Application:" /tmp/texada-app-codesign.txt
          else
            echo "::notice::Standalone .app bundle not found; verifying signed DMG and mounted app instead."
          fi

          codesign --verify --verbose=2 "$dmg"
          codesign -dv --verbose=4 "$dmg" 2> /tmp/texada-dmg-codesign.txt
          grep -F "$EXPECTED_SIGNER" /tmp/texada-dmg-codesign.txt
          grep -F "Developer ID Application:" /tmp/texada-dmg-codesign.txt

          mount_dir="$(mktemp -d)"
          printf 'Y\n' | hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          trap 'hdiutil detach "$mount_dir" -quiet || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo "::error::DMG has no installable app."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2> /tmp/texada-app-codesign.txt
          grep -F "$EXPECTED_SIGNER" /tmp/texada-app-codesign.txt
          grep -F "Developer ID Application:" /tmp/texada-app-codesign.txt

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        timeout-minutes: 270
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          dmg="$(find tauri-shell/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg" || { echo "::error::DMG artifact not found."; exit 1; }

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          KEY_PATH="$key_path" python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["APPLE_NOTARY_KEY"].strip()
          path = Path(os.environ["KEY_PATH"])
          if "BEGIN PRIVATE KEY" in raw:
              path.write_text(raw + "\n", encoding="utf-8")
          else:
              path.write_bytes(base64.b64decode(raw))
          PY
          chmod 600 "$key_path"

          run_notarytool_json() {
            local output_path="$1"
            shift
            local attempt
            local delay=20
            for attempt in 1 2 3 4 5; do
              if xcrun notarytool "$@" --output-format json > "$output_path" 2> "$output_path.stderr"; then
                return 0
              fi
              echo "::warning::notarytool $1 failed on attempt $attempt."
              sed 's/^/notarytool: /' "$output_path.stderr" || true
              sleep "$delay"
              delay=$((delay * 2))
            done
            return 1
          }

          submit_json="$RUNNER_TEMP/notary-submit.json"
          run_notarytool_json "$submit_json" submit "$dmg" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

          submission_id="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$submit_json")"
          echo "Submitted DMG for Apple notarization: $submission_id"

          notary_timeout_minutes=240
          deadline=$((SECONDS + notary_timeout_minutes * 60))
          status_json="$RUNNER_TEMP/notary-status.json"
          submission_status="In Progress"
          while [ "$submission_status" = "In Progress" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Apple notarization did not finish within ${notary_timeout_minutes} minutes for submission $submission_id."
              exit 1
            fi

            if run_notarytool_json "$status_json" info "$submission_id" \
              --key "$key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID"; then
              submission_status="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$status_json")"
              echo "Apple notarization status for $submission_id: $submission_status"
            else
              echo "::warning::Could not query notarization status for $submission_id; retrying after a short delay."
            fi

            if [ "$submission_status" = "In Progress" ]; then
              sleep 60
            fi
          done

          if [ "$submission_status" != "Accepted" ]; then
            xcrun notarytool log "$submission_id" \
              --key "$key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" || true
            echo "::error::Apple notarization status is $submission_status."
            exit 1
          fi

          for staple_attempt in 1 2 3; do
            if xcrun stapler staple "$dmg"; then
              break
            fi
            if [ "$staple_attempt" -eq 3 ]; then
              echo "::error::Failed to staple notarization ticket after $staple_attempt attempts."
              exit 1
            fi
            echo "::warning::Stapling failed on attempt $staple_attempt; retrying."
            sleep $((staple_attempt * 30))
          done
          for validate_attempt in 1 2 3; do
            if xcrun stapler validate "$dmg"; then
              break
            fi
            if [ "$validate_attempt" -eq 3 ]; then
              echo "::error::Notarization ticket validation failed after $validate_attempt attempts."
              exit 1
            fi
            echo "::warning::Ticket validation failed; retrying after Apple network interruption."
            sleep $((validate_attempt * 30))
          done
          spctl -a -t open --context context:primary-signature -v "$dmg"
          NOTARY_ID="$submission_id" INSTALLER="$dmg" TARGET="${{ matrix.rust-targets }}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          installer = Path(os.environ["INSTALLER"])
          record = {"target": os.environ["TARGET"], "source_commit": os.environ["GITHUB_SHA"],
                    "installer": installer.name, "installer_sha256": hashlib.sha256(installer.read_bytes()).hexdigest(),
                    "status": "Accepted", "submission_id": os.environ["NOTARY_ID"],
                    "stapler_validated": True, "gatekeeper_assessed": True}
          Path("notarization-" + os.environ["TARGET"] + ".json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Smoke installed macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find tauri-shell/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          python scripts/smoke-installed-desktop.py "$installer" --version "${{ needs.preflight.outputs.version }}" --expected-commit "$GITHUB_SHA" --output "native-smoke-${{ matrix.rust-targets }}.json"

      - name: Smoke installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem tauri-shell/src-tauri/target -Recurse -File -Filter *.exe | Where-Object { $_.Directory.Name -eq 'nsis' } | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer missing" }
          python scripts/smoke-installed-desktop.py $installer.FullName --version "${{ needs.preflight.outputs.version }}" --expected-commit "$env:GITHUB_SHA" --output "native-smoke-${{ matrix.rust-targets }}.json"
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows smoke failed" }

      - name: Smoke both installed Linux packages under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for format in deb AppImage; do
            if [ "$format" = deb ]; then pattern='*/bundle/deb/*.deb'; else pattern='*/bundle/appimage/*.AppImage'; fi
            installer="$(find tauri-shell/src-tauri/target -path "$pattern" -type f -print -quit)"
            test -n "$installer" || { echo "::error::Linux $format installer missing."; exit 1; }
            xvfb-run -a python scripts/smoke-installed-linux.py --installer "$installer" --format "$format" --version "${{ needs.preflight.outputs.version }}" --expected-commit "$GITHUB_SHA" --out "native-smoke-${{ matrix.rust-targets }}-$format.json"
          done

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            tauri-shell/src-tauri/target/**/bundle/dmg/*.dmg
            tauri-shell/src-tauri/target/**/bundle/nsis/*.exe
            tauri-shell/src-tauri/target/**/bundle/deb/*.deb
            tauri-shell/src-tauri/target/**/bundle/appimage/*.AppImage
            native-smoke-*.json
            notarization-*.json

  publish:
    name: Stage verified desktop release draft
    needs: [build, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate all installers and prepare manifest and checksums
        run: python scripts/prepare-desktop-release.py collect --input release-assets --output staged-release --expected-commit "$GITHUB_SHA" --version "${{ needs.preflight.outputs.version }}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ needs.preflight.outputs.version }}"
          release_tag="${{ needs.preflight.outputs.tag }}"

          mapfile -t assets < <(find staged-release -maxdepth 1 -type f | sort)

          release_notes="$(
            awk -v version="$version" '
              $0 ~ "^## " version " - " { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          )"
          if [ -z "${release_notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md has no release section for ${version}."
            exit 1
          fi

          {
            printf 'TeXada Desktop %s\n\n' "$version"
            printf '%s\n\n' "$release_notes"
            printf '%s\n' 'Installers: signed and notarized macOS arm64/x64 DMGs, Windows x64 NSIS, Linux x64 deb and AppImage.'
            printf '%s\n' 'Checksums, a common-commit build manifest and per-package installed validation records accompany the installers.'
            printf '%s\n' 'Author: CacinieP'
          } > /tmp/texada-release-notes.md

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "::error::Release $release_tag already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name "CacinieP"
          git config user.email "129482851+CacinieP@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$release_tag:refs/tags/$release_tag"
            test "$(git rev-parse "$release_tag^{commit}")" = "$GITHUB_SHA" || { echo "::error::Release tag points at another commit."; exit 1; }
          else
            git tag "$release_tag" "$GITHUB_SHA"
            git push origin "refs/tags/$release_tag"
          fi

          # Final publication is a separate review of the exact attached bytes.
          release_flags=(--draft --latest=false)
          if [[ "$version" == *-* ]]; then
            release_flags=(--draft --prerelease --latest=false)
          fi
          gh release create "$release_tag" "${assets[@]}" \
            --title "TeXada Desktop v${version}" \
            --notes-file /tmp/texada-release-notes.md \
            --target "$GITHUB_SHA" \
            "${release_flags[@]}"
