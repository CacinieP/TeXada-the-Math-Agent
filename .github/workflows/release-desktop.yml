name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Pre-release audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Ruff
        run: uv run --extra dev ruff check .

      - name: Pytest
        run: uv run --extra dev pytest

      - name: Python dependency audit
        run: uvx pip-audit --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --audit-level=moderate

      - name: JavaScript syntax check
        run: node --check tauri-shell/src/main.js

  build:
    name: Build ${{ matrix.name }}
    needs: audit
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 dmg
            os: macos-26
            rust-targets: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel dmg
            os: macos-15-intel
            rust-targets: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows x64 NSIS
            os: windows-2025
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell/src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Require macOS signing and notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" || { echo "::error::Missing signing secret APPLE_CERTIFICATE (base64 .p12)."; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo "::error::Missing signing secret APPLE_CERTIFICATE_PASSWORD."; exit 1; }
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "::error::Missing signing secret APPLE_SIGNING_IDENTITY."; exit 1; }
          test -n "$APPLE_NOTARY_KEY_ID" || { echo "::error::Missing notarization secret APPLE_NOTARY_KEY_ID."; exit 1; }
          test -n "$APPLE_NOTARY_ISSUER_ID" || { echo "::error::Missing notarization secret APPLE_NOTARY_ISSUER_ID."; exit 1; }
          test -n "$APPLE_NOTARY_KEY" || { echo "::error::Missing notarization secret APPLE_NOTARY_KEY (raw .p8 text or base64 .p8)."; exit 1; }

      - name: Import macOS signing certificate for sidecar
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/texada-signing.p12"
          keychain_path="$RUNNER_TEMP/texada-signing.keychain-db"
          CERT_PATH="$cert_path" python -c 'import base64, os; from pathlib import Path; Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE"]))'
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Build bundled FastAPI backend sidecar
        env:
          PYINSTALLER_CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python scripts/build-backend-sidecar.py --mode pyinstaller --target ${{ matrix.rust-targets }}

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tauri-shell/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.tauri-args }}

      - name: Verify macOS package signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_SIGNER: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          dmg="$(find tauri-shell/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg" || { echo "::error::DMG artifact not found."; exit 1; }
          app="$(find tauri-shell/src-tauri/target -path '*/bundle/macos/*.app' -print -quit)"
          test -n "$app" || { echo "::error::macOS app bundle not found."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2> /tmp/texada-app-codesign.txt
          grep -F "$EXPECTED_SIGNER" /tmp/texada-app-codesign.txt

          codesign --verify --verbose=2 "$dmg"
          codesign -dv --verbose=4 "$dmg" 2> /tmp/texada-dmg-codesign.txt
          grep -F "$EXPECTED_SIGNER" /tmp/texada-dmg-codesign.txt

          mount_dir="$(mktemp -d)"
          if hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -quiet; then
            trap 'hdiutil detach "$mount_dir" -quiet || true; rm -rf "$mount_dir"' EXIT
            app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            if [ -n "$app" ]; then
              codesign --verify --deep --strict --verbose=2 "$app"
              codesign -dv --verbose=4 "$app" 2> /tmp/texada-app-codesign.txt
              grep -F "$EXPECTED_SIGNER" /tmp/texada-app-codesign.txt
            else
              echo "::warning::Signed DMG verified, but no .app was found after mounting."
            fi
          else
            rm -rf "$mount_dir"
            echo "::warning::Signed DMG verified, but CI could not mount it for inner app verification."
          fi

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          dmg="$(find tauri-shell/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg" || { echo "::error::DMG artifact not found."; exit 1; }

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          KEY_PATH="$key_path" python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ["APPLE_NOTARY_KEY"].strip()
          path = Path(os.environ["KEY_PATH"])
          if "BEGIN PRIVATE KEY" in raw:
              path.write_text(raw + "\n", encoding="utf-8")
          else:
              path.write_bytes(base64.b64decode(raw))
          PY
          chmod 600 "$key_path"

          submit_json="$RUNNER_TEMP/notary-submit.json"
          xcrun notarytool submit "$dmg" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json | tee "$submit_json"

          submission_id="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$submit_json")"
          submission_status="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$submit_json")"
          if [ "$submission_status" != "Accepted" ]; then
            xcrun notarytool log "$submission_id" \
              --key "$key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" || true
            echo "::error::Apple notarization status is $submission_status."
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            tauri-shell/src-tauri/target/**/bundle/dmg/*.dmg
            tauri-shell/src-tauri/target/**/bundle/nsis/*.exe

  publish:
    name: Publish v0.1.0 release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="0.1.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            version="${release_tag#v}"
          else
            release_tag="v${version}"
          fi

          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) | sort)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "::error::Expected 3 installer assets, found ${#assets[@]}."
            find release-assets -type f -print
            exit 1
          fi

          cat > /tmp/texada-release-notes.md <<'EOF'
          TeXada Desktop 0.1.0

          English:
          - Local-first math formula agent powered by MiniCPM and Ollama.
          - Supports natural language to LaTeX, formula OCR, completion, snippets, history and desktop insertion.
          - Supports OpenAI API-compatible cloud text and vision models.
          - Includes and auto-starts the TeXada FastAPI backend; Ollama or cloud model runtime remains configurable.
          - Includes signed and notarized macOS DMGs and Windows x64 NSIS installer.

          中文：
          - 端侧优先的数学公式 Agent，默认使用 MiniCPM 和 Ollama。
          - 支持自然语言转 LaTeX、公式 OCR、补全、缩写、历史记录和桌面光标处键入。
          - 支持 OpenAI API 兼容的云侧文本和视觉模型。
          - 安装包内置并自动启动 TeXada FastAPI 后端；Ollama 或云侧模型运行时仍可配置。
          - 提供已签名并完成 Apple notarization 的 macOS DMG，以及 Windows x64 NSIS 安装包。

          Author: CacinieP
          EOF

          gh release delete "$release_tag" --cleanup-tag -y || true
          gh release delete "desktop-v${version}" --cleanup-tag -y || true

          git config user.name "CacinieP"
          git config user.email "129482851+CacinieP@users.noreply.github.com"
          git tag -f "$release_tag" "$GITHUB_SHA"
          git push origin "refs/tags/$release_tag" --force

          gh release create "$release_tag" "${assets[@]}" \
            --title "TeXada Desktop v${version}" \
            --notes-file /tmp/texada-release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
