name: Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-js:
    name: Python and frontend audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Ruff
        run: uv run --locked --extra dev --extra cas-eval --extra eval ruff check .

      - name: Pytest
        run: uv run --locked --extra dev --extra cas-eval --extra eval pytest

      - name: Python dependency audit
        # Audit the real project dependency tree. `uvx pip-audit`
        # alone runs inside an ephemeral environment and only audits
        # pip-audit's own dependencies; export the project's resolved
        # requirements instead, omitting the local project itself because
        # pip-audit resolves distribution packages from PyPI.
        run: |
          uv export --locked --extra dev --extra cas-eval --extra eval --format requirements-txt --no-hashes --no-emit-project > /tmp/texada-requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/texada-requirements.txt --strict

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --audit-level=low

      - name: JavaScript syntax check
        run: node --check tauri-shell/src/main.js

      - name: Frontend regressions
        run: node --test tests/*.test.cjs

  windows-runtime:
    name: Windows owned-process lifecycle
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Windows process-tree regressions
        run: uv run --locked --extra dev pytest -q tests/test_runtime_lifecycle.py -k windows

  glib-backport:
    name: GTK3 glib iterator backport (release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install GLib development dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libglib2.0-dev
      # The advisory reproduces with optimized iterators. This isolated crate
      # test exercises the backported source even on non-GTK desktop hosts.
      - name: Optimized iterator regression
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/texada-glib-target
        run: cargo test --release --manifest-path tauri-shell/src-tauri/vendor/glib-0.18.5/Cargo.toml --lib variant_iter

  tauri-rust:
    name: Tauri Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell/src-tauri -> target

      - name: Prepare backend sidecar stub
        run: python scripts/build-backend-sidecar.py --mode stub

      # tauri.conf.json declares resources/llama-server, and Tauri's build script
      # fails when a declared resource path is absent. The real binary is fetched
      # by scripts/fetch-llama-server.sh in the release workflow only, so audit
      # runs need a placeholder to satisfy the resource check.
      - name: Prepare llama-server stub
        run: |
          mkdir -p tauri-shell/src-tauri/resources/llama-server
          printf '#!/bin/sh\nexit 0\n' > tauri-shell/src-tauri/resources/llama-server/llama-server
          chmod +x tauri-shell/src-tauri/resources/llama-server/llama-server

      - name: Cargo check
        working-directory: tauri-shell/src-tauri
        run: cargo check --locked
