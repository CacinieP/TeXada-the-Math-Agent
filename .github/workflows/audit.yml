name: Audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-js:
    name: Python and frontend audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Ruff
        run: uv run --extra dev ruff check .

      - name: Pytest
        run: uv run --extra dev pytest

      - name: Python dependency audit
        run: uvx pip-audit --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        env:
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --audit-level=moderate

      - name: JavaScript syntax check
        run: |
          node --check tauri-shell/src/main.js
          node --check tauri-shell/TeXadaShell/TeXadaShell/assets/main.js

  tauri-rust:
    name: Tauri Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-shell/src-tauri -> target

      - name: Cargo check
        working-directory: tauri-shell/src-tauri
        run: cargo check
