[project]
name = "texada"
version = "0.2.5"
description = "Local math formula agent powered by MiniCPM"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    # FastAPI's UploadFile (used by /api/ocr) requires python-multipart at
    # import time; without it create_app() raises RuntimeError.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "openai>=1.30",
    "httpx>=0.27",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "typer>=0.12",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "pyinstaller>=6.0"]

[project.scripts]
texada = "texada.__main__:app"
texada-backend = "texada.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texada"]
sources = {"src" = ""}

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
