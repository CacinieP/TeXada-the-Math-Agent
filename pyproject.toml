[project]
name = "texada"
version = "0.2.0"
description = "Local math formula agent powered by Gemma 4 E4B"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "ollama>=0.4",
    "sympy>=1.13",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "pyperclip>=1.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
win = ["pystray>=0.19", "keyboard>=0.13"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
texada = "texada.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texada"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"